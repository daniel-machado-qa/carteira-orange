<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Carteira Orange</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#E6E9F2; --surface:#FFFFFF; --border:#E8E9EE; --chip-border:#CDCED0;
  --strong:#0F0F2A; --text:#1E1836; --sub:#5E6066; --faint:#6B6D73;
  --orange:#FC5420; --orange-hover:#E04A18; --orange-text:#D8501F;
  --icon-bg:#FFE3D9; --icon-fg:#D24515; --track:#ECEEF4; --plus:#157F52;
  --tl-line:#E1E3EA; --dot-bg:#FFFFFF; --chip-on-bg:#101030; --chip-on-fg:#FFFFFF;
  --navy:#101030; --top-line:#101030; --on-navy:#E4E5F7; --on-navy-soft:#C9CBE6; --navy-line:#333355;
  --wallet:radial-gradient(120% 140% at 100% 0%, #3A2448 0%, rgba(16,16,48,0) 55%), #101030;
  --wallet-border:#101030; --wallet-shadow:none; --ring-inner:#101030;
  --demo-bg:#FFF4EE; --demo-line:#F6D6C8; --demo-chip:#E9C3B3; --demo-text:#5E6066;
  --pend-fg:#8A4B00; --pend-bg:#FFF0D1; --ok-bg:#EDF8F2; --err-fg:#B3261E; --err-bg:#FDE7E4; --plus-on-navy:#3DDC97;
  --field-bg:#FFFFFF; --dis-bg:#E4E6EE; --dis-fg:#5E6066; --overlay:rgba(16,16,48,.55); --modal-shadow:0 24px 60px rgba(16,16,48,.28);
  --font:"Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B0B24; --surface:#15153A; --border:#24244C; --chip-border:#333355;
    --strong:#FFFFFF; --text:#E4E5F7; --sub:#A9ABC4; --faint:#8C8EAD;
    --orange-text:#FF7A4D; --icon-bg:rgba(252,84,32,.16); --icon-fg:#FF7A4D; --track:#2A2A52; --plus:#3DDC97;
    --tl-line:#2A2A52; --dot-bg:#15153A; --chip-on-bg:#FFFFFF; --chip-on-fg:#101030; --top-line:#24244C;
    --wallet:radial-gradient(120% 140% at 100% 0%, #3A2448 0%, rgba(29,29,72,0) 55%), #1B1B45;
    --wallet-border:#2E2E5E; --wallet-shadow:0 16px 40px rgba(0,0,0,.35); --ring-inner:#1B1B45;
    --demo-bg:#1A1530; --demo-line:#2E2640; --demo-chip:#4A3A50; --demo-text:#C9CBE6;
    --pend-fg:#FFC565; --pend-bg:#3A2C10; --ok-bg:#11372E; --err-fg:#FF8F85; --err-bg:#431C28; --plus-on-navy:#3DDC97;
    --field-bg:#0F0F2E; --dis-bg:#24244C; --dis-fg:#A9ABC4; --overlay:rgba(0,0,0,.62); --modal-shadow:0 24px 60px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0B24; --surface:#15153A; --border:#24244C; --chip-border:#333355;
  --strong:#FFFFFF; --text:#E4E5F7; --sub:#A9ABC4; --faint:#8C8EAD;
  --orange-text:#FF7A4D; --icon-bg:rgba(252,84,32,.16); --icon-fg:#FF7A4D; --track:#2A2A52; --plus:#3DDC97;
  --tl-line:#2A2A52; --dot-bg:#15153A; --chip-on-bg:#FFFFFF; --chip-on-fg:#101030; --top-line:#24244C;
  --wallet:radial-gradient(120% 140% at 100% 0%, #3A2448 0%, rgba(29,29,72,0) 55%), #1B1B45;
  --wallet-border:#2E2E5E; --wallet-shadow:0 16px 40px rgba(0,0,0,.35); --ring-inner:#1B1B45;
  --demo-bg:#1A1530; --demo-line:#2E2640; --demo-chip:#4A3A50; --demo-text:#C9CBE6;
  --pend-fg:#FFC565; --pend-bg:#3A2C10; --ok-bg:#11372E; --err-fg:#FF8F85; --err-bg:#431C28; --plus-on-navy:#3DDC97;
  --field-bg:#0F0F2E; --dis-bg:#24244C; --dis-fg:#A9ABC4; --overlay:rgba(0,0,0,.62); --modal-shadow:0 24px 60px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--font);font-size:14px;color:var(--text);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
a{color:var(--orange-text)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

/* faixa da demonstração */
.demo{background:var(--demo-bg);border-bottom:1px solid var(--demo-line);color:var(--demo-text);font-size:12px}
.demo .in{max-width:1280px;margin:0 auto;padding:6px 40px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.demo button{font:500 12px var(--font);padding:4px 11px;border-radius:999px;border:1px solid var(--demo-chip);background:transparent;color:var(--demo-text);cursor:pointer}
.demo button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

/* barra superior */
.top{background:var(--navy);border-bottom:1px solid var(--top-line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .in{max-width:1280px;margin:0 auto;height:64px;padding:0 40px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;border-radius:6px}
.logo img{height:30px;width:auto;display:block}
.top nav{display:flex;align-items:center;gap:16px}
.navlink{background:none;border:none;color:var(--on-navy);font:600 13px var(--font);padding:12px 4px;cursor:pointer}
.navlink[aria-current="page"]{color:#fff;box-shadow:inset 0 -2px 0 var(--orange)}
.round{width:44px;height:44px;border-radius:999px;border:1px solid var(--navy-line);background:transparent;color:var(--on-navy);display:grid;place-items:center;cursor:pointer}
.user{display:flex;align-items:center;gap:8px;border:1px solid var(--navy-line);border-radius:999px;padding:3px 3px 3px 14px;color:var(--on-navy);font-size:13px}
.av{width:34px;height:34px;border-radius:999px;background:var(--orange);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center}

main{max-width:1280px;margin:0 auto;padding:32px 40px 64px;display:flex;flex-direction:column;gap:24px}
h1{margin:0;font-size:28px;font-weight:700;color:var(--strong);text-wrap:balance}
h2{margin:0;font-size:16px;font-weight:700;color:var(--strong)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px}
.ico{width:32px;height:32px;border-radius:8px;background:var(--icon-bg);color:var(--icon-fg);display:grid;place-items:center;flex:none}
.btn{height:44px;padding:0 20px;border-radius:6px;border:none;background:var(--orange);color:#fff;font:700 14px var(--font);cursor:pointer}
.btn:hover{background:var(--orange-hover)}
.btn.ghost{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);padding:0 18px}
.btn.ghost:hover{background:rgba(255,255,255,.16)}

/* painel */
.row1{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:start}
.wallet{background:var(--wallet);border:1px solid var(--wallet-border);box-shadow:var(--wallet-shadow);border-radius:18px;padding:28px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:22px}
.wallet::after{content:"";position:absolute;right:-44px;top:-44px;width:170px;height:170px;border-radius:999px;border:28px solid rgba(252,84,32,.14);pointer-events:none}
.wallet > *{position:relative;z-index:1}
.badge{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);font-size:12px;font-weight:600}
.badge svg.i{width:14px;height:14px}
.wmain{display:flex;align-items:center;gap:24px}
.ring{--p:40;width:96px;height:96px;border-radius:999px;flex:none;display:grid;place-items:center;background:conic-gradient(var(--orange) calc(var(--p)*1%),rgba(255,255,255,.14) 0)}
.ring > div{width:78px;height:78px;border-radius:999px;background:var(--ring-inner);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring b{font-size:22px;font-weight:800}.ring small{font-size:10px;color:var(--on-navy-soft)}
.saldo{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.saldo b{font-size:52px;font-weight:800;color:var(--orange);line-height:1}
.saldo span{font-size:14px;font-weight:600}
.wtext{display:flex;flex-direction:column;gap:6px;min-width:0}
.wtext p{margin:0;font-size:13px;color:var(--on-navy-soft)}
.wtext p b{color:#fff}
.wbtns{display:flex;gap:10px;flex-wrap:wrap}
.sect{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sect a{font-size:13px;font-weight:600;text-decoration:none}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.tile b{font-size:18px;font-weight:700;color:var(--strong)}
.tile span{font-size:12px;color:var(--sub);line-height:1.35}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--border)}
.tabs button{background:none;border:none;padding:8px 0;font:500 14px var(--font);color:var(--faint);cursor:pointer}
.tabs button[aria-selected="true"]{font-weight:600;color:var(--orange-text);box-shadow:inset 0 -3px 0 var(--orange)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;font:500 12px var(--font);padding:6px 12px;border-radius:999px;border:1px solid var(--chip-border);background:transparent;color:var(--sub);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--chip-on-bg);border-color:var(--chip-on-bg);color:var(--chip-on-fg)}
.tl{position:relative;padding-left:24px;display:flex;flex-direction:column}
.tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--tl-line)}
.ev{position:relative;padding:10px 0;display:flex;flex-direction:column;gap:3px}
.ev::before{content:"";position:absolute;left:-22px;top:16px;width:12px;height:12px;border-radius:999px;background:var(--dot-bg);border:2px solid var(--orange)}
.ev .d{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.ev .h{display:flex;justify-content:space-between;gap:12px}
.ev .h b{font-size:14px;color:var(--strong)}
.ev .h span{font-size:14px;font-weight:700;color:var(--plus);white-space:nowrap}
.ev p{margin:0;font-size:13px;color:var(--sub)}
.cat{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
.cat:last-child{border-bottom:0}
.cat .n{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--text)}
.bar{height:6px;border-radius:999px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--orange);border-radius:999px}
.cat > b{font-size:14px;color:var(--strong);min-width:44px;text-align:right}
.empty{padding:12px 0;font-size:13px;color:var(--sub)}

/* regras */
.back{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:13px;font-weight:600;background:none;border:none;color:var(--orange-text);padding:6px 0;cursor:pointer}
.back svg.i{width:16px;height:16px}
.lead{margin:0;font-size:15px;line-height:1.55;color:var(--sub);max-width:68ch}
.rgrid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px);display:flex;flex-direction:column;gap:2px}
.toc a{display:block;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text);text-decoration:none}
.toc a:hover{background:var(--surface)}
.rcol{display:flex;flex-direction:column;gap:20px}
.rsec{scroll-margin-top:96px;gap:16px;padding:28px}
.rsec h2{font-size:20px}
.rsec p{margin:0;font-size:14px;line-height:1.55;color:var(--sub);max-width:72ch}
.rsec p b{color:var(--strong)}
.tbl{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:260px 160px minmax(0,1fr) 180px;gap:20px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}
.tr.hd{border-top:0;padding-top:0}
.tr .c1{display:flex;align-items:center;gap:12px;font-weight:700;color:var(--strong)}
.tr .pts{font-weight:700;color:var(--orange-text)}
.tr .how{font-size:13px;line-height:1.5;color:var(--sub)}
.tr .who{font-size:13px;font-weight:600;color:var(--text)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sub{background:var(--bg);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px}
.sub .k{font-size:13px;font-weight:600;color:var(--faint)}
.sub .v{font-size:20px;font-weight:800;color:var(--orange-text)}
.sub .v.plain{color:var(--strong)}
.sub .t{font-size:13px;line-height:1.5;color:var(--sub)}
.sub .nm{font-size:16px;font-weight:800;color:var(--strong)}
.sub .it{font-size:14px;font-weight:700;color:var(--strong)}
.sub .price{font-size:18px;font-weight:800;color:var(--orange-text)}
.sub .price small{font-size:12px;font-weight:600;color:var(--sub)}
.sub .note{font-size:12px;color:var(--faint)}
.pill-perfil{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--navy);color:#fff;font-size:12px;font-weight:600}
.pill-perfil svg.i{width:14px;height:14px}
.alert{display:flex;gap:12px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--sub)}
.alert .ic{color:var(--icon-fg);display:flex}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border);font-size:14px}
.vrow span:last-child{flex:none;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--strong)}
.faq{border-top:1px solid var(--border)}
.faq button{width:100%;background:none;border:none;padding:16px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;cursor:pointer;font:600 15px var(--font);color:var(--strong)}
.faq button svg.i{width:20px;height:20px;color:var(--icon-fg);transition:transform .2s}
.faq button[aria-expanded="true"] svg.i{transform:rotate(180deg)}
.faq p{margin:0 0 16px!important}

/* status: pendente (âmbar), validado (verde, --plus), recusado (vermelho); sempre pílula com texto */
.st{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.35;max-width:100%}
.st::before{content:"";width:8px;height:8px;border-radius:999px;background:currentColor;flex:none}
.st.pend{background:var(--pend-bg);color:var(--pend-fg)}
.st.ok{background:var(--ok-bg);color:var(--plus)}
.st.err{background:var(--err-bg);color:var(--err-fg)}
.st.neu{background:var(--bg);color:var(--sub)}
.stl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:2px 0}
.ev .h span.muted{color:var(--faint)}
.ev .h span.risc{color:var(--faint);text-decoration:line-through}

/* botões e campos novos */
.btn:disabled,.btn:disabled:hover{background:var(--dis-bg);color:var(--dis-fg);cursor:not-allowed}
.btn.line{background:transparent;border:1.5px solid var(--orange);color:var(--orange-text)}
.btn.line:hover{background:var(--icon-bg)}
.btn.quiet{background:transparent;border:1px solid var(--chip-border);color:var(--text);font-weight:600}
.btn.quiet:hover{background:var(--bg)}
fieldset{border:0;margin:0;padding:0;min-width:0}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld > label,.fld > legend,.fld .lab{font-size:13px;font-weight:600;color:var(--strong);padding:0}
.fld > legend{margin-bottom:6px}
.inp{min-height:44px;width:100%;padding:10px 12px;border-radius:6px;border:1px solid var(--chip-border);background:var(--field-bg);color:var(--text);font:500 14px var(--font)}
textarea.inp{min-height:96px;resize:vertical;line-height:1.5}
.inp[aria-invalid="true"]{border-color:var(--err-fg)}
.inp.ro{display:flex;align-items:center;background:var(--bg);font-weight:700;color:var(--strong)}
input[type="file"].inp{padding:8px 10px}
.hint{font-size:12px;line-height:1.45;color:var(--faint)}
.cnt{display:flex;justify-content:space-between;gap:12px}
.errs{margin:0;font-size:13px;font-weight:600;color:var(--err-fg)}
.errs:empty{display:none}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{position:relative;display:flex;flex-direction:column;gap:3px;min-height:44px;padding:12px 14px 12px 42px;border:1px solid var(--chip-border);border-radius:10px;cursor:pointer;font-size:13px;color:var(--sub);line-height:1.4}
.opt b{font-size:14px;color:var(--strong)}
.opt input{position:absolute;left:14px;top:14px;width:18px;height:18px;margin:0;accent-color:var(--orange)}
.opt:has(input:checked){border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
.opt:has(input:focus-visible){outline:2px solid var(--orange);outline-offset:2px}
.opt.dis{cursor:not-allowed;background:var(--bg)}
.opt.dis b{color:var(--sub)}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;color:var(--text);cursor:pointer}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--orange)}
.frow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.frow > .fld{flex:1 1 180px}
.box{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.5;background:var(--bg);color:var(--sub)}
.box .ic{display:flex;color:var(--icon-fg)}
.box.warn{background:var(--pend-bg);color:var(--pend-fg)}
.box.warn .ic{color:var(--pend-fg)}
.box b{font-weight:700}

/* modal e aviso */
.mbg{position:fixed;inset:0;z-index:20;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.modal{width:100%;max-width:540px;max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--modal-shadow);padding:24px;display:flex;flex-direction:column;gap:16px;margin:0}
.modal.wide{max-width:760px}
.modal h2{font-size:19px}
.modal .mlead{margin:0;font-size:14px;line-height:1.55;color:var(--sub)}
.modal .mlead b{color:var(--strong)}
.mact{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.resumo{margin:0;display:flex;flex-direction:column;border-top:1px solid var(--border)}
.resumo div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.resumo dt{color:var(--sub)}
.resumo dd{margin:0;font-weight:700;color:var(--strong);text-align:right}
.resumo .fim dd{color:var(--orange-text)}
.aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:10px;background:var(--navy);border:1px solid var(--navy-line);color:#fff;font-size:14px;line-height:1.45;box-shadow:var(--modal-shadow)}
.aviso .ic{display:flex;color:var(--plus-on-navy)}
.aviso button{flex:none;width:44px;height:44px;border-radius:8px;border:none;background:transparent;color:var(--on-navy);display:grid;place-items:center;cursor:pointer}

/* cabeçalho das visões */
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap}
.vhead > div{display:flex;flex-direction:column;gap:6px;min-width:0}
.count{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--navy);border:1px solid var(--navy-line);color:#fff;font-size:13px;font-weight:600}
.count b{font-size:16px;font-weight:800;color:var(--orange)}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.col{display:flex;flex-direction:column;gap:24px;min-width:0}

/* loja */
.shop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px}
.item .it{font-size:14px;font-weight:700;color:var(--strong)}
.item .price{font-size:20px;font-weight:800;color:var(--orange-text)}
.item .price small{font-size:12px;font-weight:600;color:var(--sub)}
.item .note{font-size:12px;color:var(--faint)}
.item .pe{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:6px}
.item .falta{font-size:12px;font-weight:600;color:var(--sub)}
.item .btn{width:100%}
.saldo-linha{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--sub)}
.saldo-linha b{font-size:22px;font-weight:800;color:var(--orange-text)}

/* listas (resgates, desafios, fila, lançados) */
.rows{display:flex;flex-direction:column}
.rw{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--border)}
.rows > .rw:first-child{border-top:0;padding-top:4px}
.rw .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.rw .tx b{font-size:14px;color:var(--strong)}
.rw .tx span{font-size:13px;color:var(--sub);line-height:1.45}
.rw .ac{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.rw .full{grid-column:2 / -1;min-width:0}
.rw .pts{font-size:14px;font-weight:700;color:var(--strong);white-space:nowrap}
.rw .pts.mais{color:var(--plus)}
.motivo{margin:0;font-size:13px;line-height:1.5;color:var(--sub)}
.motivo b{color:var(--strong)}
.print{display:block;max-width:100%;width:340px;max-height:230px;object-fit:contain;object-position:left top;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
.printbtn{display:block;max-width:100%;padding:0;border:none;background:none;border-radius:8px;cursor:zoom-in}
.print.big{width:100%;max-height:70vh}
.prev{display:flex;flex-direction:column;gap:6px}
.alrt{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--border)}
.rows > .alrt:first-child{border-top:0;padding-top:4px}
.alrt .tx{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5;color:var(--text)}
.alrt .tx b{color:var(--strong)}
.alrt ul{margin:0;padding-left:20px;font-size:13px;line-height:1.6;color:var(--sub)}

/* People/RH */
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.pgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fsec{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.fsec + .fsec{border-top:1px solid var(--border);padding-top:18px}
.fsec h3{margin:0;font-size:14px;font-weight:700;color:var(--strong)}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:10px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}
.crow .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.crow .tx b{font-size:14px;color:var(--strong)}
.crow .tx span{font-size:12px;color:var(--faint)}
.stat .v{font-size:24px}
.ind-cat .cat .n{font-size:13px}

@media (max-width:980px){
  .two{grid-template-columns:1fr}
  .shop{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .top nav{gap:8px}
  .navlink{padding:12px 6px}
  .modal{padding:20px 16px}
  .opts{grid-template-columns:1fr}
  .rw{grid-template-columns:auto minmax(0,1fr)}
  .rw .ac{grid-column:2;justify-content:flex-start}
  .rw .full{grid-column:1 / -1}
  .rw .pts{grid-column:2;grid-row:auto}
  .crow{grid-template-columns:minmax(0,1fr) auto}
  .crow .tx{grid-column:1 / -1}
  .pgrid.c3{grid-template-columns:1fr}
  .mact .btn{flex:1 1 auto}
}
@media (max-width:480px){
  .user #user-nome{display:none}
  .user{padding:3px}
  .shop{grid-template-columns:1fr}
}

@media (max-width:980px){
  .row1{grid-template-columns:1fr}
  .rgrid{grid-template-columns:1fr}
  .toc{display:none}
}
@media (max-width:760px){
  .demo .in,.top .in{padding-left:16px;padding-right:16px}
  .top .in{height:56px}
  main{padding:20px 16px 48px;gap:20px}
  h1{font-size:24px}
  .wallet{padding:20px;gap:18px}
  .wmain{gap:16px}
  .ring{width:84px;height:84px}.ring > div{width:68px;height:68px}
  .saldo b{font-size:40px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card,.rsec{padding:16px}
  .rsec h2{font-size:18px}
  .g3{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tr.hd{display:none}
  .tr{grid-template-columns:1fr auto;gap:4px 12px;align-items:start;padding:14px 0}
  .tr .c1{grid-column:1}
  .tr .pts{grid-column:2;grid-row:1;white-space:nowrap}
  .tr .how,.tr .who{grid-column:1 / -1}
  .tr .who{font-size:12px;color:var(--faint)}
  .navlink .long{display:none}
}
@media (min-width:761px){ .navlink .short{display:none} }
@media (max-width:360px){
  .saldo b{font-size:32px}
  .user{padding-left:10px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;scroll-behavior:auto!important} }
</style>

</head>

  // ---------- visão BP ----------
  function filaItem(f){
    if (f.tipo === 'resg'){
      const r = f.o, p = pessoa(r.pessoa);
      return `<div class="rw" data-fila="resg-${r.id}"><span class="ico">${ic('gift')}</span>
        <div class="tx"><b>${p.nome}</b><span>Resgate: ${esc(r.nome)}</span><span class="num">${fmt(r.preco)} pontos já saíram do saldo · pedido em ${dBarra(r.data)}</span></div>
        <div class="ac"><button class="btn" type="button" data-acao="aprovar" data-tipo="resg" data-id="${r.id}">Aprovar</button><button class="btn line" type="button" data-acao="recusar" data-tipo="resg" data-id="${r.id}">Recusar</button></div>
      </div>`;
    }
    const l = f.o, p = pessoa(l.pessoa);
    const oque = l.desafio ? `${esc(l.t)}${l.print ? ', com print' : ''}` : l.por === 'tdm' ? `${esc(l.t)}, lançado por ${estado.papeis.TDM.nome} (TDM): ${esc(l.desc)}` : esc(l.t);
    return `<div class="rw" data-fila="lanc-${l.n}"><span class="ico">${ic(catDe(l.c).ic)}</span>
      <div class="tx"><b>${p.nome}</b><span>${oque}</span><span class="num"><span class="pts mais">+${fmt(l.v)} pontos</span> · enviado em ${dBarra(l.data)}</span></div>
      <div class="ac"><button class="btn" type="button" data-acao="aprovar" data-tipo="lanc" data-id="${l.n}">Aprovar</button><button class="btn line" type="button" data-acao="recusar" data-tipo="lanc" data-id="${l.n}">Recusar</button></div>
      ${l.print ? `<div class="full"><button class="printbtn" type="button" data-acao="ver-print" data-id="${l.n}" aria-label="Ampliar o print de ${p.nome}"><img class="print" src="${l.print}" alt="Print enviado por ${p.nome}"></button></div>` : ''}
    </div>`;

  function telaBP(){

    const nome = (id) => pessoa(id).nome;

          <div class="rows" id="alertas">${novos.length ? novos.map(alertaHtml).join('') : `<div class="empty">Nenhum alerta novo.</div>`}</div>

  function aprovar(tipo, id){
    if (tipo === 'resg'){
      const r = estado.resgates.find(x => x.id === id); if (!r || r.status !== 'pendente') return;
      r.status = 'aprovado'; r.decidido = HOJE;
      avisar(`Resgate aprovado. ${pessoa(r.pessoa).nome} já vê "${r.dayoff ? 'Aprovado, alinhar a data com o BP ou TDM' : 'Aprovado, retirar na FCamara'}".`);
    } else {
      const l = estado.lancamentos.find(x => x.n === +id); if (!l || l.status !== 'pendente') return;
      l.status = 'validado'; l.decidido = HOJE;
      creditar(l.pessoa, l.c, l.v);
      l.p = l.por === 'tdm' ? `${l.desc} Registrado pelo TDM e validado pelo BP.` : 'Validado pelo BP.';
      avisar(`Aprovado. ${pessoa(l.pessoa).nome} recebeu ${fmt(l.v)} pontos.`);
    }
  }
  function recusar(tipo, id, motivo){
    if (tipo === 'resg'){
      const r = estado.resgates.find(x => x.id === id); if (!r || r.status !== 'pendente') return;
      r.status = 'recusado'; r.motivo = motivo; r.decidido = HOJE;
      avisar(`Resgate recusado. Os ${fmt(r.preco)} pontos voltaram ao saldo de ${pessoa(r.pessoa).nome}.`);
    } else {
      const l = estado.lancamentos.find(x => x.n === +id); if (!l || l.status !== 'pendente') return;
      l.status = 'recusado'; l.motivo = motivo; l.decidido = HOJE;
      l.p = `Recusado pelo BP. Motivo: ${motivo}`;
      avisar(`Recusado. ${pessoa(l.pessoa).nome} vê o motivo no histórico.`);
    }
  }

  // ---------- visão TDM ----------
  function avisoLimiteTdm(){
    const r = estado.rasc.tdm;
    if (!r.pessoa || !r.cat) return '';
    const p = pessoa(r.pessoa);
    if (r.cat === 'perf'){
      const n = estado.lancamentos.filter(l => l.pessoa === r.pessoa && l.c === 'perf' && l.data.startsWith(ANO) && l.status !== 'recusado').length;
      return n >= 2

  function salvarParams(form){
    const g = (id) => form.elements[id].value.trim();
    const campos = ['p-casa','p-ind','p-perf','p-cliente','p-mentoria','p-projeto','p-guilda','p-artigo','p-desafio','p-baixa','p-media','p-mensal','p-n2','p-n3'];
    const val = {}, ruins = [];
    for (const c of campos){
      const s = g(c), n = Number(s);
      const min = ['p-baixa','p-media','p-mensal','p-n2','p-n3'].includes(c) ? 1 : 0;
      const ok = s !== '' && Number.isInteger(n) && n >= min;
      marcarInvalido(c, !ok); if (!ok) ruins.push(c); else val[c] = n;
    }
    const erros = [];
    if (ruins.length) erros.push('Use números inteiros (faixas, saldo mensal e níveis a partir de 1).');
    else if (val['p-n3'] <= val['p-n2']) { erros.push('O Nível 3 precisa começar acima do Nível 2.'); marcarInvalido('p-n3', true); }
    if (erros.length){ document.getElementById('params-err').textContent = erros.join(' '); return; }
    Object.assign(estado.params.pts, { casa:val['p-casa'], ind:val['p-ind'], perf:val['p-perf'], cliente:val['p-cliente'], mentoria:val['p-mentoria'], projeto:val['p-projeto'], guilda:val['p-guilda'], artigo:val['p-artigo'], desafio:val['p-desafio'] });
    estado.params.faixas = { baixa:val['p-baixa'], media:val['p-media'] };
    estado.params.saldoMensal = val['p-mensal'];
    estado.params.niveis = [0, val['p-n2'], val['p-n3']];
    render();
    avisar('Parâmetros salvos. Os novos valores já valem em todas as telas.');
  }

      <p class="mlead"><b>${esc(d.nome)}</b> vale ${fmt(estado.params.pts.desafio)} pontos. Os pontos entram depois que o BP validar; até lá, fica pendente.</p>
      ${d.print ? `<div class="fld"><label for="des-arquivo">Print que comprova</label>
        <input class="inp" type="file" id="des-arquivo" accept="image/*">
        <span class="hint">A imagem fica só nesta demonstração, na memória do navegador.</span></div>
        <div class="prev" id="des-prev">${m.print ? `<span class="lbl">Prévia</span><img class="print" src="${m.print}" alt="Prévia do print escolhido">` : ''}</div>`
      : `<div class="box"><span class="ic">${ic('grad')}</span><span>Este treinamento não pede print. O BP confere a conclusão antes de validar.</span></div>`}
      <p class="errs" id="des-err" role="alert"></p>
      <div class="mact"><button class="btn quiet" type="button" data-fechar>Cancelar</button><button class="btn" type="submit" id="des-enviar">Enviar para validação</button></div>`);
  }

  function modalRecusar(m){
    let quem, oque, extra = '';
    if (m.item === 'resg'){ const r = estado.resgates.find(x => x.id === m.id); quem = pessoa(r.pessoa).nome; oque = `Resgate: ${esc(r.nome)}`; extra = `Os ${fmt(r.preco)} pontos voltam ao saldo de ${quem}.`; }
    else { const l = estado.lancamentos.find(x => x.n === +m.id); quem = pessoa(l.pessoa).nome; oque = esc(l.t); extra = 'Nenhum ponto é creditado.'; }
    return casca('f-recusa', 'Recusar', `
      <p class="mlead"><b>${quem}</b> · ${oque}. ${extra}</p>
      <div class="fld"><label for="recusa-motivo">Motivo</label>
        <textarea class="inp" id="recusa-motivo" name="motivo" maxlength="250" placeholder="Ex.: o print não mostra a avaliação publicada."></textarea>
        <span class="hint">Obrigatório. ${quem} vê este motivo.</span></div>
      <p class="errs" id="recusa-err" role="alert"></p>
      <div class="mact"><button class="btn quiet" type="button" data-fechar>Cancelar</button><button class="btn" type="submit" id="recusa-confirmar">Recusar</button></div>`);
  }

  function modalConfirmar(m){
    return casca('m-confirmar', m.titulo, `<p class="mlead">${m.texto}</p>
      <div class="mact"><button class="btn quiet" type="button" data-fechar>Cancelar</button><button class="btn" type="button" data-acao="${m.acao}" data-id="${m.id}" id="confirmar-ok">${m.ok}</button></div>`);
  }

  function modalPrint(m){
    const l = estado.lancamentos.find(x => x.n === +m.id);
    return casca('m-print', `Print de ${pessoa(l.pessoa).nome}`, `<img class="print big" src="${l.print}" alt="Print enviado por ${pessoa(l.pessoa).nome} para ${esc(l.t)}">
      <div class="mact"><button class="btn quiet" type="button" data-fechar>Fechar</button></div>`, true);
  }

  function renderModal(){
    const m = estado.modal;
    document.body.style.overflow = m ? 'hidden' : '';
    if (!m){ modalRoot.innerHTML = ''; return; }
    modalRoot.innerHTML = m.tipo === 'reconhecer' ? modalReconhecer() : m.tipo === 'resgatar' ? modalResgatar(m)
      : m.tipo === 'desafio' ? modalDesafio(m) : m.tipo === 'recusar' ? modalRecusar(m) : m.tipo === 'print' ? modalPrint(m) : modalConfirmar(m);
  }

  function marcarInvalido(id, ruim){ const el = document.getElementById(id); if (el) el.setAttribute('aria-invalid', ruim ? 'true' : 'false'); }

  function enviarReconhecimento(){
    const de = estado.eu, r = estado.rasc.rec, erros = [];
    if (!r.para) erros.push('Escolha o colega.');
    if (!r.faixa) erros.push('Escolha a faixa.');
    if (!r.texto.trim()) erros.push('Conte o que a pessoa fez.');
    marcarInvalido('rec-para', !r.para); marcarInvalido('rec-texto', !r.texto.trim());
    const v = r.faixa ? estado.params.faixas[r.faixa] : 0;
    if (!erros.length && v > podeDar(de)) erros.push('Essa faixa passa do que você ainda pode dar este mês.');
    if (erros.length){ document.getElementById('rec-err').textContent = erros.join(' '); return; }
    const texto = r.texto.trim();
    estado.reconhecimentos.push({ de, para:r.para, data:HOJE, faixa:r.faixa, v, texto });
    creditar(r.para, 'rec', v);
    addLanc({ pessoa:r.para, data:HOJE, t:`Reconhecimento de ${pessoa(de).nome}`, v, p:texto, c:'rec' });
    const para = pessoa(r.para).nome;
    estado.rasc.rec = { para:'', faixa:'', texto:'' };
    fecharModal(); render();
    avisar(`${para} recebeu ${fmt(v)} pontos. Você ainda pode dar ${fmt(podeDar(de))} este mês.`);
  }

  function enviarDesafio(){
    const m = estado.modal, d = estado.desafios.find(x => x.id === m.id);
    if (d.print && !m.print){ document.getElementById('des-err').textContent = 'Anexe o print para enviar.'; marcarInvalido('des-arquivo', true); return; }
    addLanc({ pessoa:estado.eu, data:HOJE, t:`Desafio: ${d.nome}`, v:estado.params.pts.desafio, p:'Aguardando validação do BP.', c:'desafio', desafio:d.id, status:'pendente', fila:true, print:m.print || null });
    voltaFoco = null;
    fecharModal(); render();
    document.getElementById('t-desafios')?.closest('section')?.scrollIntoView({ block:'start' });
    avisar('Desafio enviado. Ele fica pendente até o BP validar.');
  }

  modalRoot.addEventListener('click', (e) => {
    if (e.target.matches('[data-fundo]') || e.target.closest('[data-fechar]')){ fecharModal(); return; }
    const b = e.target.closest('button[data-acao]'); if (!b) return;
    const m = estado.modal;
    if (b.dataset.acao === 'confirmar-resgate'){
      const it = estado.loja.find(x => x.id === b.dataset.id);
      if (!it || saldo(estado.eu) < it.preco) { fecharModal(); return; }
      estado.resgates.push({ id:novoId('r'), pessoa:estado.eu, nome:it.nome, preco:it.preco, dayoff:it.ret.startsWith('Alinhado'), data:HOJE, status:'pendente' });
      voltaFoco = null;
      fecharModal(); render();
      document.getElementById('meus-resgates')?.scrollIntoView({ block:'start' });
      avisar(`Resgate registrado: ${it.nome}. Aguardando aprovação do BP.`);
      return;
    }
    if (b.dataset.acao === 'remover-item'){
      const it = estado.loja.find(x => x.id === m.id);
      estado.loja = estado.loja.filter(x => x.id !== m.id);
      voltaFoco = null; fecharModal(); render();
      avisar(`${it.nome} saiu do catálogo. Resgates já feitos continuam valendo.`);
    }
  });
  modalRoot.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.target;
    if (f.id === 'f-rec') enviarReconhecimento();
    else if (f.id === 'f-desafio-feito') enviarDesafio();
    else if (f.id === 'f-recusa'){
      const motivo = f.elements.motivo.value.trim();
      if (!motivo){ document.getElementById('recusa-err').textContent = 'Escreva o motivo da recusa.'; marcarInvalido('recusa-motivo', true); f.elements.motivo.focus(); return; }
      const { item, id } = estado.modal;
      recusar(item, id, motivo.replace(/[.!?]+$/, ''));
      voltaFoco = null; fecharModal(); render();
      document.getElementById('t-fila')?.focus();
    }
  });
  modalRoot.addEventListener('change', (e) => {
    const t = e.target;
    if (t.name === 'faixa'){ estado.rasc.rec.faixa = t.value; return; }
    if (t.id === 'des-arquivo'){
      const file = t.files && t.files[0], err = document.getElementById('des-err');
      err.textContent = '';
      if (!file) return;
      if (!file.type.startsWith('image/')){ err.textContent = 'Escolha um arquivo de imagem (PNG, JPG ou parecido).'; t.value = ''; return; }
      const rd = new FileReader();
      rd.onload = () => {
        estado.modal.print = rd.result;
        marcarInvalido('des-arquivo', false);
        document.getElementById('des-prev').innerHTML = `<span class="lbl">Prévia</span><img class="print" src="${rd.result}" alt="Prévia do print escolhido">`;
      };
      rd.readAsDataURL(file);
    }
  });
  document.addEventListener('keydown', (e) => {
    if (!estado.modal) return;
    if (e.key === 'Escape'){ fecharModal(); return; }
    if (e.key === 'Tab'){
      const f = [...modalRoot.querySelectorAll('button:not(:disabled), select, textarea, input:not(:disabled)')];
      if (!f.length) return;
      const [a, z] = [f[0], f[f.length - 1]];
      if (e.shiftKey && document.activeElement === a){ e.preventDefault(); z.focus(); }
      else if (!e.shiftKey && document.activeElement === z){ e.preventDefault(); a.focus(); }
    }
  });

  // rascunhos dos formulários (reconhecer e TDM) guardados no estado enquanto a pessoa digita
  document.addEventListener('input', (e) => {
    const t = e.target, k = t.dataset && t.dataset.rasc; if (!k) return;
    const [f, campo] = k.split('.');
    estado.rasc[f][campo] = t.value;
    if (k === 'rec.texto') document.getElementById('rec-cnt').textContent = `${t.value.length}/250`;
    if (k === 'tdm.desc') document.getElementById('tdm-cnt').textContent = `${t.value.length}/250`;
    if (f === 'tdm') atualizarTdm();
  });

  // ---------- montagem ----------
  function render(){
    if (estado.papel !== 'Colaborador' && estado.tela === 'loja') estado.tela = 'painel';
    renderPapeis();
    const col = estado.papel === 'Colaborador';
    const regrasBtn = document.getElementById('nav-regras'), lojaBtn = document.getElementById('nav-loja');
    if (estado.tela === 'regras') regrasBtn.setAttribute('aria-current', 'page'); else regrasBtn.removeAttribute('aria-current');
    if (estado.tela === 'loja') lojaBtn.setAttribute('aria-current', 'page'); else lojaBtn.removeAttribute('aria-current');
    lojaBtn.hidden = !col;
    const quem = col ? pessoa(estado.eu) : estado.papeis[estado.papel];
    document.getElementById('user-nome').textContent = quem.curto;
    document.getElementById('user-av').textContent = quem.iniciais;
    app.innerHTML = estado.tela === 'regras' ? telaRegras()
      : !col ? (estado.papel === 'BP' ? telaBP() : estado.papel === 'TDM' ? telaTDM() : telaRH())
      : estado.tela === 'loja' ? telaLoja() : telaPainel();
  }

  app.addEventListener('click', (e) => {
    const t = e.target.closest('button, a'); if (!t) return;
    if (t.dataset.aba){ estado.aba = t.dataset.aba; render(); return; }
    if (t.dataset.filtro){ estado.filtro = t.dataset.filtro; render(); return; }
    if (t.dataset.faq !== undefined){
      const k = +t.dataset.faq; estado.faqAberta = estado.faqAberta === k ? -1 : k;
      render(); document.getElementById('faq-' + k)?.focus(); return;
    }
    if (t.dataset.ir === 'historico'){ e.preventDefault(); estado.aba = 'tl'; render(); document.getElementById('historico')?.scrollIntoView({ block:'start' }); return; }
    if (t.dataset.ir){ e.preventDefault(); ir(t.dataset.ir); return; }
    if (t.dataset.ancora){ e.preventDefault(); document.getElementById(t.dataset.ancora)?.scrollIntoView({ block:'start' }); return; }
    const a = t.dataset.acao, id = t.dataset.id;
    if (a === 'reconhecer') abrirModal({ tipo:'reconhecer' });
    else if (a === 'resgatar') abrirModal({ tipo:'resgatar', id });
    else if (a === 'desafio') abrirModal({ tipo:'desafio', id, print:null });
    else if (a === 'aprovar'){ aprovar(t.dataset.tipo, id); render(); document.getElementById('t-fila')?.focus(); }
    else if (a === 'recusar') abrirModal({ tipo:'recusar', item:t.dataset.tipo, id });
    else if (a === 'ver-print') abrirModal({ tipo:'print', id });
    else if (a === 'visto'){ const al = alertas().find(x => x.k === id); if (al) estado.alertasVistos[id] = al.rs.length; render(); document.getElementById('t-alertas')?.focus(); }
    else if (a === 'alternar-desafio'){ const d = estado.desafios.find(x => x.id === id); d.ativo = !d.ativo; render(); avisar(`${d.nome}: ${d.ativo ? 'ativado' : 'desativado'}.`); }
    else if (a === 'remover-item'){ const it = estado.loja.find(x => x.id === id); abrirModal({ tipo:'confirmar', titulo:'Remover item do catálogo', texto:`<b>${esc(it.nome)}</b> sai da Loja Orange e ninguém mais consegue resgatar. Resgates já feitos continuam valendo.`, acao:'remover-item', id, ok:'Remover item' }); }
  });

  app.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.target;
    if (f.id === 'f-tdm') enviarTdm();
    else if (f.id === 'f-params') salvarParams(f);
    else if (f.id === 'f-precos'){
      const novos = {}; let ruim = false;
      estado.loja.forEach(it => { const n = Number(f.elements[it.id].value); const ok = Number.isInteger(n) && n >= 1; marcarInvalido('preco-' + it.id, !ok); if (ok) novos[it.id] = n; else ruim = true; });
      if (ruim){ document.getElementById('precos-err').textContent = 'Use preços inteiros a partir de 1 ponto.'; return; }
      estado.loja.forEach(it => { it.preco = novos[it.id]; });
      render(); avisar('Preços salvos. A Loja e a página de regras já mostram os novos valores.');
    }
    else if (f.id === 'f-item'){
      const nome = f.elements.nome.value.trim(), preco = Number(f.elements.preco.value), erros = [];
      if (!nome) erros.push('Escreva o nome do item.');
      if (!(Number.isInteger(preco) && preco >= 1)) erros.push('Informe um preço inteiro a partir de 1.');
      marcarInvalido('item-nome', !nome); marcarInvalido('item-preco', !(Number.isInteger(preco) && preco >= 1));
      if (erros.length){ document.getElementById('item-err').textContent = erros.join(' '); return; }
      estado.loja.push({ id:novoId('item'), nome, preco, ret:f.elements.ret.value });
      render(); avisar(`${nome} entrou no catálogo.`);
    }
    else if (f.id === 'f-desafio'){
      const nome = f.elements.nome.value.trim();
      if (!nome){ document.getElementById('desafio-err').textContent = 'Escreva o nome do desafio.'; marcarInvalido('des-nome', true); return; }
      estado.desafios.push({ id:novoId('des'), nome, print:f.elements.print.checked, anual:f.elements.anual.checked, ativo:true });
      render(); avisar(`Desafio "${nome}" incluído e ativo.`);
    }
  });
  app.addEventListener('change', (e) => {
    const t = e.target, k = t.dataset && t.dataset.rasc;
    if (k && k.startsWith('tdm.')){ estado.rasc.tdm[k.split('.')[1]] = t.value; atualizarTdm(); }
  });
  modalRoot.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.rasc === 'rec.para') estado.rasc.rec.para = t.value;
  });

  const h = (location.hash || '').slice(1);
  if (h === 'regras' || h === 'loja') estado.tela = h;
  render();
})();
</script>

</body>
</html>
